version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: market_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - market_network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: market_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/market_db
      FRED_API_KEY: ${FRED_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - market_network
    restart: unless-stopped
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      sleep 5 &&
      python database.py &&
      echo 'Database initialized!' &&
      uvicorn main:app --host 0.0.0.0 --port 8000 --reload
      "

  scheduler:
    build: ./backend
    container_name: market_scheduler
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/market_db
      FRED_API_KEY: ${FRED_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - market_network
    restart: unless-stopped
    command: python scheduler.py

  frontend:
    build: ./frontend
    container_name: market_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - market_network
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  backend_models:

networks:
  market_network:
    driver: bridge
